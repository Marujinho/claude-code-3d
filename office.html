<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escritório 3D — o personagem faz o que o Claude faz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --ink: #1a1c2c; --muted: #566c86;
    --page: #dfe7ee; --page-ink: #1a1c2c; --panel: #ffffff; --accent: #ffcd75; --accent-dark: #ef7d57; --shadow: 0 10px 30px rgba(20,30,50,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #141a24; --page-ink: #e8eef4; --panel: #1f2736; --ink: #e8eef4; --muted: #9fb0c4; --shadow: 0 10px 30px rgba(0,0,0,.45); }
  }
  :root[data-theme="dark"] { --page: #141a24; --page-ink: #e8eef4; --panel: #1f2736; --ink: #e8eef4; --muted: #9fb0c4; --shadow: 0 10px 30px rgba(0,0,0,.45); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--page); color: var(--page-ink); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); padding: 12px; } }

  .game { position: relative; height: min(78vh, 680px); min-height: 360px; border-radius: 18px; background: #000; overflow: hidden; box-shadow: var(--shadow); }
  @media (max-width: 860px) { .game { height: 60vh; } }
  .game canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 12px; top: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  .tag { background: rgba(255,255,255,.88); color: #1a1c2c; backdrop-filter: blur(8px); border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: 18px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .zoom { display: flex; gap: 0; pointer-events: auto; border-radius: 12px; overflow: hidden; }
  .zbtn { font: inherit; font-weight: 800; font-size: 20px; width: 40px; height: 40px; color: #1a1c2c; background: rgba(255,255,255,.88); backdrop-filter: blur(8px); border: 0; border-left: 1px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; line-height: 1; }
  .zbtn:first-child { border-left: 0; }
  .zbtn.zval { width: auto; padding: 0 8px; font-size: 15px; font-weight: 400; }
  .zbtn:active { background: var(--accent); }
  .zbtn:focus-visible { outline: 3px dashed #b13e53; outline-offset: 2px; }
  .zoom { box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .tag small { display: block; font-weight: 400; font-size: 14px; color: #566c86; }
  /* barra de energia = quanto sobra do limite de uso */
  .hud-left { display: flex; gap: 10px; align-items: stretch; min-width: 0; }
  .energy { display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 190px; min-width: 120px; font-size: 14px; }
  .energy-top { display: flex; justify-content: space-between; gap: 8px; line-height: 1; }
  .energy-top b { font-weight: 800; font-variant-numeric: tabular-nums; }
  .energy-bar { position: relative; height: 16px; border: 2px solid #1a1c2c; border-radius: 6px; background: #333c57; overflow: hidden; }
  .energy-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #38b764; transition: width .6s ease, background-color .6s; }
  .energy-fill::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; }
  .energy-bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), #1a1c2c calc(10% - 2px) 10%); }
  .energy.low .energy-fill { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .energy.low .energy-fill { animation: none; } .energy-fill { transition: none; } }
  .energy small { font-size: 12px; line-height: 1; }
  @media (max-width: 520px) { .energy { width: 130px; } .energy small { display: none; } }
  .bubble { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); background: #fff; color: #1a1c2c; border-radius: 12px; padding: 6px 12px; font-size: 15px; font-weight: 600; white-space: nowrap; pointer-events: none; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: #fff; transform: translateX(-50%) rotate(45deg); }
  .bubble.show { display: block; }

  aside { display: grid; gap: 18px; }
  .panel { background: var(--panel); color: var(--ink); border-radius: 16px; box-shadow: var(--shadow); padding: 18px; }
  .panel h2 { margin: 0 0 12px; font-size: 19px; font-weight: 800; line-height: 1.2; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .modes .btn { padding: 6px 9px; font-size: 14px; }
  .btn { font: inherit; font-weight: 700; font-size: 15px; color: var(--ink); background: transparent; border: 1.5px solid rgba(128,140,160,.35); border-radius: 12px; padding: 8px 10px; cursor: pointer; text-align: left; line-height: 1.25; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: var(--accent-dark); }
  .btn:active, .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1a1c2c; }
  .btn[aria-pressed="true"] i { color: #6b5a30; }
  .btn:focus-visible { outline: 3px dashed #b13e53; outline-offset: 3px; }
  .btn i { display: block; font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); }
  .cmds[hidden] { display: none; }
  .btn kbd { display: block; width: fit-content; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; padding: 0 5px; margin-bottom: 3px; border-radius: 5px; background: rgba(128,140,160,.18); color: var(--ink); }
  .btn[aria-pressed="true"] kbd { background: rgba(26,28,44,.12); color: #1a1c2c; }
  .cmds .note { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
  .cmds code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--ink); background: rgba(128,140,160,.18); padding: 1px 5px; border-radius: 5px; }
  .cmds .note[hidden], .modes:empty { display: none; }
  .modes:empty + .note { margin-top: 0; }
  #skillList .btn span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* animação + chat cabem na altura da janela: a cena encolhe, o chat fica sempre visível */
  .main { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 14px; min-width: 0; height: calc(100vh - 48px); height: calc(100dvh - 48px); min-height: 520px; }
  .main .game { height: auto; min-height: 260px; }
  @media (max-width: 860px) { .main { height: calc(100vh - 24px); height: calc(100dvh - 24px); min-height: 460px; } .main .game { min-height: 200px; } }
  .chat[hidden] { display: none; }
  .log { height: min(200px, 24vh); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; font-size: 15px; }
  .msg { border-radius: 12px; padding: 7px 11px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; }
  .msg.me { align-self: flex-end; max-width: 90%; background: var(--accent); color: #1a1c2c; }
  .msg.ai { background: rgba(128,140,160,.14); }
  .msg.err { background: rgba(177,62,83,.14); color: #b13e53; }
  .msg.note { background: rgba(128,140,160,.08); border: 1px dashed rgba(128,140,160,.4); font-size: 14px; }
  .chat form { display: grid; gap: 8px; }
  .chat { padding: 14px; }
  .chat h2 { margin-bottom: 8px; font-size: 17px; }
  .chat form { grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
  @media (max-width: 520px) { .chat form { grid-template-columns: minmax(0, 1fr); } }
  .chat textarea { font: inherit; font-size: 15px; color: var(--ink); background: transparent; border: 1.5px solid rgba(128,140,160,.35); border-radius: 12px; padding: 8px 10px; resize: none; height: 42px; max-height: 120px; }
  .chat textarea { transition: border-color .15s, box-shadow .15s; }
  .chat textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,205,117,.35); }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .row .btn { text-align: center; padding: 0 16px; height: 42px; }
  @media (max-width: 520px) { .row .btn { flex: 1; padding: 0 10px; } }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1c2c; }
  .row .btn.mic { width: 42px; padding: 0; display: grid; place-items: center; flex: none; }
  .btn.mic[hidden] { display: none; }
  .btn.mic svg { width: 20px; height: 20px; }
  .btn.mic[aria-pressed="true"] { background: #b13e53; border-color: #b13e53; color: #fff; animation: micPulse 1.2s ease-in-out infinite; }
  @keyframes micPulse { 50% { box-shadow: 0 0 0 6px rgba(177,62,83,.25); } }
  @media (prefers-reduced-motion: reduce) { .btn.mic[aria-pressed="true"] { animation: none; } }
  .btn:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="game" id="game">
      <div class="hud">
        <div class="hud-left">
          <div class="tag energy" id="energy" role="meter" aria-label="Limite de uso restante (5 h)" aria-valuemin="0" aria-valuemax="100">
            <div class="energy-top"><span>Token Usage</span><b id="energyVal">—</b></div>
            <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
            <small id="energySub">sem dados do limite</small>
          </div>
        </div>
        <div class="zoom" role="group" aria-label="Zoom">
          <button class="zbtn" id="zoomOut" aria-label="Afastar">−</button>
          <button class="zbtn zval" id="zoomReset" aria-label="Zoom mínimo"><span id="zoomVal">0%</span></button>
          <button class="zbtn" id="zoomIn" aria-label="Aproximar">+</button>
        </div>
      </div>
      <div class="bubble" id="bubble"></div>
    </div>
    <section class="panel chat" id="chat" hidden>
      <h2>Falar com o Claude</h2>
      <div class="log" id="chatLog" aria-live="polite"></div>
      <form id="chatForm">
        <textarea id="chatInput" rows="1" placeholder="Ex.: leia o server.js e explique a rota /hook" aria-label="Mensagem para o Claude"></textarea>
        <div class="row">
          <button class="btn mic" id="chatMic" type="button" aria-label="Ditar por voz" aria-pressed="false" title="Ditar por voz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg></button>
          <button class="btn primary" id="chatSend" type="submit">Enviar</button>
          <button class="btn" id="chatStop" type="button" disabled>Parar</button>
        </div>
      </form>
    </section>
  </div>
  <aside>
    <section class="panel cmds" id="cmds" hidden>
      <h2>Comandos</h2>
      <div class="modes" id="modes"></div>
      <p class="note">Também dá pra digitar no chat: <code>/plan</code>, <code>/compact</code>… <kbd>⇧Tab</kbd> alterna planejar/executar e <kbd>Esc</kbd> para.</p>
    </section>
    <section class="panel cmds" id="skills" hidden>
      <h2>Skills</h2>
      <div class="modes" id="skillList"></div>
      <p class="note" id="skillEmpty" hidden>Nenhuma skill criada ainda.</p>
    </section>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= modos ================= */
const MODES = {
  idle:     { label: 'Aguardando',       sub: '', bubble: 'zzz…' },
  planning: { label: 'Planejando',   sub: '...',  bubble: 'hmm… primeiro isso, depois aquilo' },
  coding:   { label: 'Programando',  sub: '...',  bubble: 'tac tac tac tac' },
  review:   { label: 'Revisando',    sub: '...',    bubble: 'aqui tem um bug…' },
  thinking: { label: 'Pensando',     sub: '...', bubble: 'e se…?' },
  waiting:  { label: 'Esperando você', sub: '',   bubble: 'e aí, o que acha?' },
  done:     { label: 'Concluído',    sub: '!', bubble: 'pronto!' },
};
const gameEl = document.getElementById('game');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!window.THREE) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = 'Não foi possível carregar o Three.js. Recarregue a página.'; document.querySelector('.hud-left').prepend(t); }

/* ================= renderer / câmera ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.domElement.setAttribute('aria-label', 'Quarto gamer 3D com o personagem trabalhando');
gameEl.insertBefore(renderer.domElement, gameEl.firstChild);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe9dfd3, 30, 60);
const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 80);
const SCALE = 1;
function resize() {
  const w = gameEl.clientWidth, h = gameEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(gameEl);

/* ================= materiais estilo cartoon ================= */
const matCache = {};
const mat = c => matCache[c] || (matCache[c] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.82, metalness: 0.02 }));
const surf = (map) => new THREE.MeshStandardMaterial({ map, roughness: 0.9, metalness: 0 });
function box(w, h, d, color) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function blob(geo, r, color) {
  const m = new THREE.Mesh(geo, mat(color)); m.castShadow = true; m.receiveShadow = true;
  return m;
}
const sphere = (r) => new THREE.SphereGeometry(r, 20, 14);
// LEDs RGB: cada pedaço tem uma fase, e o tick faz a cor correr (ver "RGB" no loop)
const leds = [];
function ledMat(ph) { const m = new THREE.MeshBasicMaterial({ color: 0xff3df2, toneMapped: false }); leds.push({ m, ph }); return m; }
function ledLine(len, ph0, span, thick = 0.04) {
  const g = new THREE.Group(), n = Math.max(1, Math.round(len / 0.5)), sw = len / n;
  for (let i = 0; i < n; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(sw, thick, 0.03), ledMat(ph0 + span * i / n)); s.position.x = -len / 2 + sw * (i + 0.5); g.add(s); }
  return g;
}
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function pixelTexture(cv, rx, ry) {
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}
// papel de parede: listras suaves com bolinhas
function wallpaperCanvas(base, stripe, dot) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 128, 128);
  g.fillStyle = stripe; for (let x = 0; x < 128; x += 32) g.fillRect(x, 0, 12, 128);
  g.fillStyle = dot; for (let y = 8; y < 128; y += 32) for (let x = 22; x < 128; x += 32) { g.beginPath(); g.arc(x, y, 2.2, 0, Math.PI * 2); g.fill(); g.beginPath(); g.arc(x, y + 16, 2.2, 0, Math.PI * 2); g.fill(); }
  return c;
}
// madeira: tábuas com veios
function woodCanvas(base, dark, light) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0, 0, 128, 128);
  for (let y = 0; y < 128; y += 32) {
    g.fillStyle = dark; g.fillRect(0, y, 128, 2);
    for (let i = 0; i < 12; i++) { g.strokeStyle = i % 2 ? dark : light; g.globalAlpha = 0.25 + rnd() * 0.3; g.lineWidth = 0.8 + rnd(); g.beginPath();
      const yy = y + 4 + rnd() * 26; g.moveTo(0, yy); g.bezierCurveTo(40, yy + rnd() * 4 - 2, 88, yy - rnd() * 4 + 2, 128, yy); g.stroke(); }
    g.globalAlpha = 1;
  }
  return c;
}

/* ================= o quarto ================= */
// três paredes (fundo, esquerda, direita) e o chão; a frente fica aberta pra câmera, como uma casa de bonecas
const ROOM = { x0: -5.8, x1: 5.8, z0: -4.5, z1: 4.0, h: 3.2 };
const FLOOR = 0.16;
const roomW = ROOM.x1 - ROOM.x0, roomD = ROOM.z1 - ROOM.z0, roomCz = (ROOM.z0 + ROOM.z1) / 2;
const floor = new THREE.Mesh(new THREE.BoxGeometry(roomW, 0.16, roomD),
  surf(pixelTexture(woodCanvas('#4a4058', '#342c42', '#5c5270'), 4, 3)));
floor.position.set(0, 0.08, roomCz); floor.receiveShadow = true; scene.add(floor);
const floorEdge = box(roomW + 0.3, 0.3, roomD + 0.15, 0x15121f); floorEdge.position.set(0, -0.14, roomCz - 0.075); floorEdge.castShadow = false; scene.add(floorEdge);

const wallTex = pixelTexture(wallpaperCanvas('#2b2540', '#302a48', '#3d3460'), 1, 1);
function wall(w, x, z, yaw, ph0) {
  const t = wallTex.clone(); t.needsUpdate = true; t.repeat.set(w / 1.6, ROOM.h / 1.6);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, ROOM.h, 0.2), surf(t));
  m.position.set(x, FLOOR + ROOM.h / 2, z); m.rotation.y = yaw; m.receiveShadow = true; scene.add(m);
  const base = box(w, 0.18, 0.06, 0x15121f); base.castShadow = false; base.position.set(0, -ROOM.h / 2 + 0.09, 0.13); m.add(base);   // rodapé
  const top = box(w + 0.2, 0.12, 0.3, 0x15121f); top.castShadow = false; top.position.set(0, ROOM.h / 2 + 0.06, 0); m.add(top);       // acabamento de cima
  const strip = ledLine(w - 0.2, ph0, 1 / 3); strip.position.set(0, ROOM.h / 2 - 0.1, 0.12); m.add(strip);                             // fita de LED no teto
  return m;
}
// as fitas emendam: esquerda (frente → fundo), fundo (esq → dir), direita (fundo → frente)
const leftWall = wall(roomD, ROOM.x0 - 0.1, roomCz, Math.PI / 2, 0);
const backWall = wall(roomW + 0.2, 0, ROOM.z0 - 0.1, 0, 1 / 3);
const rightWall = wall(roomD, ROOM.x1 + 0.1, roomCz, -Math.PI / 2, 2 / 3);
const WALL_Z = ROOM.z0 + 0.02;   // face interna da parede do fundo

// janela no meio da parede do fundo (céu de dia, estrelas à noite)
const skyCv = document.createElement('canvas'); skyCv.width = 128; skyCv.height = 96;
const skyG = skyCv.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCv); skyTex.encoding = THREE.sRGBEncoding;
function drawSky(dark) {
  const gr = skyG.createLinearGradient(0, 0, 0, 96);
  gr.addColorStop(0, dark ? '#0d1330' : '#6fb8f0'); gr.addColorStop(1, dark ? '#2a2f5e' : '#c8e8ff');
  skyG.fillStyle = gr; skyG.fillRect(0, 0, 128, 96);
  if (dark) { skyG.fillStyle = '#fff'; for (let k = 0; k < 40; k++) skyG.fillRect((k * 37) % 128, (k * 53) % 70, 1.5, 1.5); skyG.beginPath(); skyG.arc(96, 22, 9, 0, Math.PI * 2); skyG.fillStyle = '#f4f0d0'; skyG.fill(); }
  else { skyG.fillStyle = 'rgba(255,255,255,.9)'; [[30, 30], [84, 52]].forEach(([x, y]) => { skyG.beginPath(); skyG.arc(x, y, 10, 0, 7); skyG.arc(x + 12, y - 4, 12, 0, 7); skyG.arc(x + 25, y, 9, 0, 7); skyG.fill(); }); }
  skyTex.needsUpdate = true;
}
const win = new THREE.Group(); win.position.set(0, FLOOR + 1.85, WALL_Z); scene.add(win);
const glass = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 1.4), new THREE.MeshBasicMaterial({ map: skyTex, toneMapped: false })); glass.position.z = 0.01; win.add(glass);
[[0, 0.74, 2.24, 0.12], [0, -0.74, 2.24, 0.12], [-1.06, 0, 0.12, 1.6], [1.06, 0, 0.12, 1.6], [0, 0, 0.07, 1.4], [0, 0, 2.0, 0.07]].forEach(([x, y, w, h]) => {
  const f = box(w, h, 0.1, 0x2a2436); f.castShadow = false; f.position.set(x, y, 0.05); win.add(f);
});
const sill = box(2.4, 0.08, 0.28, 0x2a2436); sill.position.set(0, -0.82, 0.14); win.add(sill);

function spriteTexture(rows, fg, bg) {
  const px = 8, c = document.createElement('canvas'); c.width = 16 * px; c.height = 12 * px;
  const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height); g.fillStyle = fg;
  const ox = Math.floor((16 - rows[0].length) / 2), oy = Math.floor((12 - rows.length) / 2);
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === 'X') g.fillRect((x + ox) * px, (y + oy) * px, px, px); }));
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.magFilter = THREE.NearestFilter; return t;
}

function applyTheme() {
  const attr = document.documentElement.getAttribute('data-theme');
  const dark = attr ? attr === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  renderer.setClearColor(dark ? 0x0c0a14 : 0x1c1830); scene.fog.color.set(dark ? 0x0c0a14 : 0x1c1830);
  hemi.color.set(dark ? 0x6a5acd : 0xd8ccff); hemi.groundColor.set(dark ? 0x140f20 : 0x3a2d50); hemi.intensity = dark ? 0.35 : 0.55;
  sun.color.set(dark ? 0x9a8cff : 0xfff1e0); sun.intensity = dark ? 0.35 : 0.9; fill.intensity = dark ? 0.2 : 0.3;
  lampLight.intensity = dark ? 1.4 : 0.6; lampShade.material.emissiveIntensity = dark ? 1.4 : 0.9;
  neonLight.intensity = dark ? 1.4 : 0.7; pcLight.intensity = dark ? 1.2 : 0.6;
  drawSky(dark);
}
applyTheme();

// ---- barra de energia: used = % do limite de 5 h já usado; a barra mostra o que sobra ----
function setUsage(used, resetsAt) {
  if (typeof used !== 'number' || !isFinite(used)) return;
  used = Math.max(0, Math.min(100, used));
  const left = Math.round(100 - used);
  const el = document.getElementById('energy'), fill = document.getElementById('energyFill');
  fill.style.width = left + '%';
  fill.style.backgroundColor = left > 50 ? '#38b764' : left > 20 ? '#ffcd75' : '#b13e53';
  el.classList.toggle('low', left <= 10);
  el.setAttribute('aria-valuenow', left);
  document.getElementById('energyVal').textContent = left + '%';
  const r = resetsAt ? new Date(resetsAt < 1e12 ? resetsAt * 1000 : resetsAt) : null;
  document.getElementById('energySub').textContent = (r && !isNaN(r) ? ` · Reset às ${r.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : '');
}

const NEEDS_SESSION = ['compact', 'context'];
function addLine(cls, text) {
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  const stick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  logEl.appendChild(d); if (stick) logEl.scrollTop = logEl.scrollHeight;
  return d;
}
const TOOL_VERB = { Read: 'lendo', Grep: 'procurando', Glob: 'procurando arquivos', Edit: 'editando', Write: 'escrevendo' };
function setBusy(b) {
  busy = b; sendEl.disabled = b; stopEl.disabled = !b;
  [...modesEl.children].forEach(el => { if (!['plan', 'normal'].includes(el.dataset.cmd)) el.disabled = b || (NEEDS_SESSION.includes(el.dataset.cmd) && !hasSession); });
  [...skillsEl.children].forEach(el => { el.disabled = b; });
}
// painel "Skills": um botão por skill; clicar roda /nome-da-skill no chat
function setSkills(list) {
  skillsEl.textContent = '';
  (list || []).forEach(s => {
    const b = document.createElement('button'); b.className = 'btn'; b.type = 'button'; b.disabled = busy;
    b.innerHTML = '<span></span>'; b.firstChild.textContent = s.name; b.title = s.description || '/' + s.name;
    b.onclick = () => post('/command', { name: 'skill', skill: s.name });
    skillsEl.appendChild(b);
  });
  document.getElementById('skillEmpty').hidden = skillsEl.children.length > 0;
  document.getElementById('skills').hidden = false;
}
function setPerm(pm) {
  permMode = pm;
  [...modesEl.children].forEach(el => { if (el.dataset.cmd === 'plan' || el.dataset.cmd === 'normal') el.setAttribute('aria-pressed', (el.dataset.cmd === 'plan') === (pm === 'plan')); });
}
function onChat(d) {
  if (d.type === 'hello') { connected = true; hasSession = d.hasSession; logEl.textContent = ''; aiMsg = null; chatEl.hidden = false; document.getElementById('cmds').hidden = false; setSkills(d.skills); setBusy(d.busy); setPerm(d.permMode); }   // o servidor manda o histórico logo em seguida
  else if (d.type === 'perm') setPerm(d.permMode);
  else if (d.type === 'activity') activity = d.text;
  else if (d.type === 'note') { aiMsg = null; addLine('msg note', d.text); }
  else if (d.type === 'start') { addLine('msg me', d.text); aiMsg = null; setBusy(true); }
  else if (d.type === 'textStart') aiMsg = null;
  else if (d.type === 'delta') {
    if (!aiMsg) aiMsg = addLine('msg ai', '');
    aiMsg.textContent += d.text;
    logEl.scrollTop = logEl.scrollHeight;
  }
  else if (d.type === 'tool') {
    aiMsg = null;   // o que ele está fazendo vai só pro balão, não pro chat
    activity = `${TOOL_VERB[d.name] || 'usando ' + d.name} ${d.name === 'Glob' ? '' : d.target.split('/').pop()}`.trim();
  }
  else if (d.type === 'result') {
    aiMsg = null;
    if (d.ok) hasSession = true;
    if (!d.ok) { if (d.error !== 'interrompido') addLine('msg err', 'Erro: ' + d.error); else if (!d.replay) say('parei!', 2000); }
  }
  else if (d.type === 'idle') setBusy(false);
  else if (d.type === 'reset') { logEl.textContent = ''; aiMsg = null; hasSession = false; setBusy(busy); }
}
function post(url, body) {
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
    .then(r => r.ok ? null : r.json().then(j => say(j.error || 'erro', 2500)));
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const micEl = document.getElementById('chatMic');
let rec = null, micBase = '';
function stopMic(discard) {
  if (!rec) return;
  if (discard) rec.onresult = null;   // ao enviar, ignora o que ainda chegar depois
  rec.stop();
}
function startMic() {
  rec = new SpeechRec();
  rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = true;
  micBase = inputEl.value.trim() ? inputEl.value.trim() + ' ' : '';   // continua depois do que já foi digitado
  rec.onresult = e => { inputEl.value = micBase + [...e.results].map(r => r[0].transcript.trim()).join(' '); inputEl.scrollTop = inputEl.scrollHeight; };
  rec.onerror = e => say(e.error === 'not-allowed' ? 'preciso de permissão pro microfone' : e.error === 'no-speech' ? 'não ouvi nada' : 'o microfone falhou', 2500);
  rec.onend = () => { rec = null; micEl.setAttribute('aria-pressed', 'false'); inputEl.focus(); };
  rec.start();
  micEl.setAttribute('aria-pressed', 'true');
}
if (!SpeechRec) micEl.hidden = true;
else micEl.onclick = () => rec ? stopMic() : startMic();
document.getElementById('chatForm').addEventListener('submit', e => {

    () => { boardG.strokeStyle = '#b13e53'; boardG.beginPath(); boardG.moveTo(38, 13); boardG.lineTo(38, 22); boardG.stroke(); },
    () => { boardG.strokeStyle = '#3b5dc9'; boardG.strokeRect(24.5, 22.5, 28, 10); },
    () => { boardG.fillStyle = '#ffcd75'; for (let i = 0; i < 4; i++) boardG.fillRect(6, 18 + i * 5, 10 - i * 2, 2); },
    () => { boardG.fillStyle = '#38b764'; boardG.fillRect(50, 4, 8, 8); boardG.fillStyle = '#f4f4f4'; boardG.fillRect(53, 6, 2, 2); },
    () => { boardG.strokeStyle = '#b13e53'; boardG.beginPath(); boardG.moveTo(12, 13); boardG.lineTo(12, 18); boardG.stroke(); },
  ];
  for (let i = 0; i < Math.min(step, items.length); i++) items[i]();
  boardTex.needsUpdate = true;
}
drawScreen(false); drawBoard(0);

/* ================= balão ================= */
const bubble = document.getElementById('bubble');
let sayText = '', sayUntil = 0;
function say(t, ms = 1600) { sayText = t; sayUntil = performance.now() + ms; }
function toScreen(v) {
  const p = v.clone().project(camera);
  const r = gameEl.getBoundingClientRect(), bw = 9, w = r.width - bw * 2, h = r.height - bw * 2;
  return { x: Math.round(((p.x + 1) / 2 * w) / SCALE) * SCALE, y: Math.round(((1 - p.y) / 2 * h) / SCALE) * SCALE };
}

/* ================= loop ================= */
const clock = new THREE.Clock();
const SPEED = 2.8;
const lerpAngle = (a, b, k) => { let d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return a + d * k; };
let tGlobal = 0, sayCooldown = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
  tGlobal += dt;
  const S = STATIONS[mode];
  const anim = reduce ? 0 : 1;

  // ---- máquina de estados: levanta -> anda -> vira -> senta/age ----
  let moving = false;
  if (phase === 'stand') { sitF += (0 - sitF) * Math.min(1, dt * 6); lieF += (0 - lieF) * Math.min(1, dt * 4); if (sitF < 0.03 && lieF < 0.03) { sitF = 0; lieF = 0; phase = 'walk'; } }
  else if (phase === 'walk') {
    const dx = target.x - hero.position.x, dz = target.z - hero.position.z, d = Math.hypot(dx, dz);
    if (d < 0.08) { hero.position.x = target.x; hero.position.z = target.z; phase = 'turn'; }
    else {
      const l = Math.min(d, SPEED * dt);
      hero.position.x += dx / d * l; hero.position.z += dz / d * l;
      hero.rotation.y = lerpAngle(hero.rotation.y, Math.atan2(dx, dz), Math.min(1, dt * 12));
      moving = true;
    }
  } else if (phase === 'turn') {
    hero.rotation.y = lerpAngle(hero.rotation.y, S.yaw, Math.min(1, dt * 8));
    if (Math.abs(Math.atan2(Math.sin(S.yaw - hero.rotation.y), Math.cos(S.yaw - hero.rotation.y))) < 0.05) { hero.rotation.y = S.yaw; phase = 'act'; actT = 0; seatY = S.seatY || 0; lieY = S.lieY || 0; kneeF = S.knee ?? 1; }
  } else if (phase === 'act') {
    sitF += ((S.sit ? 1 : 0) - sitF) * Math.min(1, dt * 6);
    lieF += ((S.lie ? 1 : 0) - lieF) * Math.min(1, dt * 4);
    actT += dt;
  }

  // ---- pose base ----
  walkT = moving ? walkT + dt * 10 : walkT * 0.8;
  const sw = Math.sin(walkT) * (moving ? 0.7 : 0);
  legL.hip.rotation.x = sw - Math.PI / 2 * sitF; legR.hip.rotation.x = -sw - Math.PI / 2 * sitF;
  legL.knee.rotation.x = legR.knee.rotation.x = Math.PI / 2 * sitF * kneeF;
  armL.rotation.x = -sw * 0.8; armR.rotation.x = sw * 0.8; armL.rotation.z = armR.rotation.z = 0;
  body.rotation.x = 0; head.rotation.set(0, 0, 0); torso.scale.set(1, 1, 1);
  hero.position.y = FLOOR + (moving ? Math.abs(Math.sin(walkT)) * 0.05 : 0) + seatY * sitF + lieY * lieF;
  hero.rotation.x = -Math.PI / 2 * lieF;
  zzz.forEach(z => z.visible = false);
  thought.visible = false; bookMesh.visible = false; pen.visible = false;
  screenGlow.intensity = 0;
  let breathing = Math.sin(tGlobal * 2.5) * 0.02 * anim;

  // ---- ações por modo ----
  const t = actT;
  if (phase === 'act') switch (mode) {
    case 'idle': {
      // dormindo de costas, respiração lenta
      const br = Math.sin(t * 1.4) * anim;
      torso.scale.set(1 + br * 0.03, 1, 1 + br * 0.06);
      armL.rotation.z = 0.25; armR.rotation.z = -0.25; armL.rotation.x = armR.rotation.x = 0.05;
      legL.hip.rotation.x = legR.hip.rotation.x = 0.04; legL.knee.rotation.x = legR.knee.rotation.x = 0;
      head.rotation.z = 0.25 + Math.sin(t * 0.3) * 0.05 * anim;
      if (lieF > 0.9) zzz.forEach((z, i) => {
        const ph = ((t * 0.55 + i / 3) % 1);
        z.visible = anim > 0;
        z.position.set(hero.position.x + 0.35 + ph * 0.5 + i * 0.05, hero.position.y + 0.55 + ph * 1.1, hero.position.z - 1.15 + ph * 0.15);
        const sc = 0.22 + ph * 0.28; z.scale.set(sc, sc, 1); z.material.opacity = ph < 0.15 ? ph / 0.15 : 1 - (ph - 0.15) / 0.85;
      });
      break;
    }
    case 'planning': {
      body.rotation.x = 0.35;
      head.rotation.x = 0.45;
      armL.rotation.x = -1.35; armL.rotation.z = 0.4;             // mão esquerda segura a folha
      // caneta rabiscando: pequenos círculos e traços
      armR.rotation.x = -1.45 + Math.sin(t * 9) * 0.08 * anim;
      armR.rotation.z = -0.25 + Math.sin(t * 6.3) * 0.12 * anim;
      pen.visible = true;
      thought.visible = true; thought.position.set(0.55, 1.95, 0.1);
      thought.scale.setScalar(0.8 + Math.sin(t * 2) * 0.03);
      gear.rotation.z = t * 2 * anim; gear.rotation.x = 0.4; cube.rotation.y = t * 1.5 * anim; cube.rotation.x = t * 0.7;
      boardT += dt; if (boardT > 1.6 && anim) { boardT = 0; boardStep = (boardStep + 1) % 10; drawBoard(boardStep); }
      // de vez em quando olha pro quadro
      if (Math.sin(t * 0.6) > 0.7) { head.rotation.x = -0.25; body.rotation.x = 0.05; }
      break;
    }
    case 'coding': {
      const f = 26; // frenético
      body.rotation.x = 0.28 + Math.sin(t * f / 2) * 0.01 * anim;
      head.rotation.x = 0.2; head.rotation.y = Math.sin(t * 3) * 0.08 * anim;
      armL.rotation.x = -1.25 + Math.max(0, Math.sin(t * f)) * 0.22 * anim; armL.rotation.z = 0.28;
      armR.rotation.x = -1.25 + Math.max(0, Math.sin(t * f + Math.PI)) * 0.22 * anim; armR.rotation.z = -0.28;
      screenGlow.intensity = 1.2 + Math.sin(t * 20) * 0.3;
      screenT += dt;
      if (screenT > 0.12) { screenT = 0; if (Math.random() > 0.15) pushCodeLine(); else codeLines = []; drawScreen(true); }

      break;
    }
    case 'review': {
      body.rotation.x = 0.15 + breathing;
      bookMesh.visible = true;
      armL.rotation.x = -1.3; armL.rotation.z = 0.35; armR.rotation.x = -1.3; armR.rotation.z = -0.35;
      head.rotation.x = 0.5; head.rotation.y = ((t * 0.8) % 1.2 - 0.6) * 0.5 * anim;  // lendo linha a linha
      if (Math.floor(t / 4) !== Math.floor((t - dt) / 4)) { armR.rotation.x = -1.7; }
      break;
    }
    case 'thinking': {
      // anda de um lado pro outro no meio do quarto com a mão no queixo
      const px = -1.2 + Math.sin(t * 0.9) * 1.3;
      const vx = Math.cos(t * 0.9);
      hero.position.x = px;
      hero.rotation.y = lerpAngle(hero.rotation.y, vx > 0 ? Math.PI / 2 : -Math.PI / 2, Math.min(1, dt * 8));
      walkT += dt * 7 * anim; const s2 = Math.sin(walkT) * 0.5 * Math.abs(vx) * anim;
      legL.hip.rotation.x = s2; legR.hip.rotation.x = -s2;
      armL.rotation.x = -s2 * 0.6; armL.rotation.z = 0.12;
      armR.rotation.x = -2.3; armR.rotation.z = -0.9;              // mão no queixo
      head.rotation.x = 0.25; head.rotation.z = 0.12; body.rotation.x = 0.1;
      hero.position.y = FLOOR + Math.abs(Math.sin(walkT)) * 0.04 * anim;
      thought.visible = true; thought.position.set(0.5, 2.15, 0); thought.scale.setScalar(1);
      gear.rotation.z = t * 3 * anim; gear.rotation.x = 0.4; cube.rotation.y = t * 2 * anim; cube.rotation.x = t;
      break;
    }
    case 'waiting': {
      // sentado no chão, pernas esticadas, balança o pé e olha pra câmera
      legL.knee.rotation.x = 0; legR.knee.rotation.x = 0;
      legL.hip.rotation.x = -Math.PI / 2 * sitF + 0.15; legR.hip.rotation.x = -Math.PI / 2 * sitF + 0.15;
      legR.hip.rotation.z = Math.sin(t * 6) * 0.08 * anim; legL.hip.rotation.z = 0;
      armL.rotation.x = 0.4; armL.rotation.z = 0.5; armR.rotation.x = 0.4; armR.rotation.z = -0.5;   // mãos apoiadas atrás
      body.rotation.x = -0.15 + breathing;
      const toCam = Math.atan2(camPos.x - hero.position.x, camPos.z - hero.position.z) - hero.rotation.y;
      head.rotation.y = Math.atan2(Math.sin(toCam), Math.cos(toCam)) * 0.8;
      head.rotation.z = Math.sin(t * 0.8) * 0.12 * anim;
      if (Math.sin(t * 1.5) > 0.9) { armR.rotation.x = -2.6; armR.rotation.z = -0.4; }   // acena de vez em quando
      break;
    }
    case 'done': {
      // pula comemorando
      const j = Math.abs(Math.sin(t * 5)) * 0.55 * anim;
      hero.position.y = FLOOR + j;
      armL.rotation.x = -2.9; armR.rotation.x = -2.9; armL.rotation.z = 0.5 + Math.sin(t * 10) * 0.2 * anim; armR.rotation.z = -0.5 - Math.sin(t * 10) * 0.2 * anim;
      legL.hip.rotation.x = -0.4 * (j / 0.55); legR.hip.rotation.x = -0.4 * (j / 0.55); legL.knee.rotation.x = legR.knee.rotation.x = 0.8 * (j / 0.55);
      head.rotation.x = -0.25;
      hero.rotation.y = S.yaw + (t > 2 && t < 3.2 ? (t - 2) / 1.2 * Math.PI * 2 : 0);          // um giro
      if (anim && Math.floor(t / 2.5) !== Math.floor((t - dt) / 2.5) && t < 12) popConfetti(12);
      break;
    }
  }
  if (mode !== 'waiting') legL.hip.rotation.z = legR.hip.rotation.z = 0;
  { const d = new Date(), mn = d.getMinutes() + d.getSeconds() / 60; hand1.rotation.z = -mn / 60 * Math.PI * 2; hand2.rotation.z = -((d.getHours() % 12) + mn / 60) / 12 * Math.PI * 2; }   // relógio de verdade
  if (mode !== 'coding') { screenT += dt; if (screenT > 0.5) { screenT = 0; drawScreen(false); } }

  // ---- RGB: a cor corre pelas fitas de LED ----
  const hue = reduce ? 0.8 : tGlobal * 0.12;
  leds.forEach(l => l.m.color.setHSL((hue + l.ph) % 1, 1, 0.55));
  lampShade.material.emissive.setHSL((hue + 0.15) % 1, 1, 0.5); lampLight.color.setHSL((hue + 0.15) % 1, 1, 0.6);
  pcLight.color.setHSL((hue + 0.5) % 1, 1, 0.6);
  fans.forEach(f => f.rotation.z += dt * 10 * anim);
  neonFace.material.opacity = anim && Math.sin(tGlobal * 0.7) > 0.93 && Math.random() < 0.3 ? 0.35 : 1;   // neon falha de vez em quando

  // ---- confete ----
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i]; c.userData.v.y -= 9 * dt;
    c.position.addScaledVector(c.userData.v, dt); c.rotation.x += c.userData.r.x * dt; c.rotation.y += c.userData.r.y * dt;
    if (c.position.y < FLOOR + 0.02) { c.position.y = FLOOR + 0.02; c.userData.v.set(0, 0, 0); c.userData.t = (c.userData.t || 0) + dt; }
    if (c.userData.t > 2.5) { scene.remove(c); confetti.splice(i, 1); }
  }

  // ---- demo automática ----
  if (autoEl.checked) { autoT += dt; if (autoT > 9) { autoT = 0; setMode(AUTO_ORDER[(AUTO_ORDER.indexOf(mode) + 1) % AUTO_ORDER.length]); } }

  // ---- câmera fixa, com zoom ----
  const a = gameEl.clientWidth / gameEl.clientHeight;
  const wide = a < 1.2;            // tela alta (celular): recua um pouco pra caber tudo
  zoom += (zoomTarget - zoom) * Math.min(1, dt * 8);
  const base = new THREE.Vector3(0.6, wide ? 12.5 : 10, wide ? 15 : 12.5);
  const look = new THREE.Vector3(0, 0.6, -0.3);
  camPos.lerp(look.clone().add(base.sub(look).multiplyScalar(1 / zoom)), Math.min(1, dt * 6));
  camLook.lerp(look, Math.min(1, dt * 3));
  camera.position.copy(camPos); camera.lookAt(camLook);

  renderer.render(scene, camera);

  // ---- balão de fala ----
  {
    const p = toScreen(hero.position.clone().add(new THREE.Vector3(0, 2.2 + (thought.visible ? 0.7 : 0), 0)));
    const t = now < sayUntil ? sayText : statusText();
    if (bubble.textContent !== t) bubble.textContent = t;
    bubble.style.left = p.x + 'px'; bubble.style.top = p.y + 'px'; bubble.classList.add('show');
  }

  requestAnimationFrame(tick);
}
resize();
tick();
</script>
